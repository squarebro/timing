name: 데이터 갱신

on:
  push:
    branches: [main]
    paths:
      - 'Invest.html'
      - 'fetch_data.py'
      - 'market_sources.py'
      - 'update_hynix_signals.py'
      - '.github/workflows/update-data.yml'
  schedule:
    # 하루 5회: 한국시간 09:00, 12:00, 14:00, 16:00, 22:00 (cron은 UTC).
    - cron: "0 0 * * *"
    - cron: "0 3 * * *"
    - cron: "0 5 * * *"
    - cron: "0 7 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 버튼도 쓸 수 있게

permissions:
  contents: write
  pages: write

concurrency:
  group: timing-data-json
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: python -m pip install 'yfinance' 'pandas>=2,<3' 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5' 'lxml>=5,<7'

      - name: 수집·보존 로직 회귀 테스트
        run: python -m unittest discover -s tests -v

      - name: data.json 생성
        id: fetch
        run: python fetch_data.py
        continue-on-error: true   # 부분 실패여도 아래에서 커밋 여부를 직접 판단

      - name: 선택 보완 자료 수집 (국채금리·수급)
        env:
          NAVER_MAX_PAGES: '10'
        run: python -u update_hynix_signals.py

      - name: 결과 확인
        run: |
          if [ ! -f data.json ]; then
            echo "data.json이 아예 생성되지 않았습니다. 이전 버전을 그대로 둡니다."
            exit 1
          fi
          python3 -c "
          import json
          d = json.load(open('data.json'))
          n = len(d['series']); total = len(d['symbols'])
          print(f'{n}/{total}개 심볼 성공')
          print('실패:', d['failed'] if d['failed'] else '없음')
          "

      - name: 변경 여부 확인 후 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "데이터 자동 갱신 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Request GitHub Pages refresh after data commit
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.requestPagesBuild({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              core.info('Requested a GitHub Pages rebuild for the latest main data.');
            } catch (error) {
              core.warning('Data was saved; Pages rebuild request failed: ' + error.message);
            }
