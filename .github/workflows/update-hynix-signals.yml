name: Update Hynix flow and US real yield
on:
  workflow_dispatch:
  schedule:
    - cron: '15 9 * * 1-5' # 18:15 KST weekdays; holidays may have no new data
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --no-cache-dir pandas requests pykrx
      - run: python update_hynix_signals.py
      - name: Commit data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json
          git diff --cached --quiet || (git commit -m 'Update SK hynix flows and real yield' && git push)
