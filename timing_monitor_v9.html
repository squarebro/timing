<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>투자 타이밍 모니터 · Timing Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E6E4DB; --paper-2:#EFEDE6; --card:#FBFAF6;
  --ink:#15181E; --ink-2:#4A5058; --ink-3:#878D95;
  --rule:#C9C6BA; --grid:#D6D3C7;
  --cobalt:#22467F; --jade:#1B6E52; --amber:#9C7414;
  --rust:#9E3524; --clay:#5B4B7A;
  --shadow:0 1px 0 rgba(21,24,30,.06), 0 2px 10px rgba(21,24,30,.05);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),
                   linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  color:var(--ink);font-family:'IBM Plex Sans KR',sans-serif;
  padding:20px 16px 56px; min-height:100vh;
}
.wrap{max-width:1140px;margin:0 auto}

/* 최상단 1,000만 원 자금 배분 보드 */
.alloc-box {
  background: var(--cobalt); color: #fff; padding: 20px;
  border-radius: 4px; margin-bottom: 24px; box-shadow: var(--shadow);
}
.alloc-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
.alloc-title { font-family:'IBM Plex Sans Condensed',sans-serif; font-size: 18px; font-weight: 700; }
.alloc-sub { font-family:'IBM Plex Mono',monospace; font-size: 12px; opacity: 0.8; }
.alloc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.alloc-card { background: rgba(255,255,255,0.1); padding: 14px; border-radius: 4px; border-left: 4px solid #fff; }
.alloc-card .name { font-size: 13px; font-weight: 600; opacity: 0.9; }
.alloc-card .val { font-family:'IBM Plex Mono',monospace; font-size: 22px; font-weight: 700; margin: 6px 0 2px; color: #52D6A4; }
.alloc-card .desc { font-size: 11px; opacity: 0.8; line-height: 1.4; }

.masthead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:13px;margin-bottom:3px}
.masthead h1{font-family:'IBM Plex Sans Condensed',sans-serif;font-size:clamp(25px,6vw,40px);font-weight:700;letter-spacing:-.02em;line-height:.95}
.masthead .en{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}
.stamp{font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-align:right;line-height:1.65;color:var(--ink-2)}
.stamp b{color:var(--ink);font-weight:600}
.pulse{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--jade);margin-right:5px;vertical-align:1px;animation:blink 2.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.rule-thin{height:1px;background:var(--rule);margin-bottom:20px}

.sec{display:flex;align-items:baseline;gap:10px;margin:28px 0 12px}
.sec h2{font-family:'IBM Plex Sans Condensed',sans-serif;font-size:14.5px;font-weight:700}
.sec .n{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-3);letter-spacing:.1em}
.sec .ln{flex:1;height:1px;background:var(--rule)}

.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.bcard{background:var(--card);padding:16px;border:1px solid var(--rule);border-radius:4px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.bcard .bt{display:flex;justify-content:space-between;align-items:baseline}
.bcard .bn{font-family:'IBM Plex Sans Condensed',sans-serif;font-size:15px;font-weight:700}
.bcard .bg{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--ink-3);text-transform:uppercase}
.bcard .bv{font-family:'IBM Plex Mono',monospace;font-size:36px;font-weight:700;line-height:1;margin:4px 0}
.bcard .wj-badge{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;padding:3px 8px;border-radius:2px;width:fit-content}

.wj-p0{background:#E2E8F0;color:#475569} 
.wj-p1{background:#DEF7EC;color:#03543F}
.wj-p2{background:#E1EFFE;color:#1E429F} 
.wj-p3{background:#FDF6B2;color:#723B10} 
.wj-p4{background:#FDE8E8;color:#9B1C1C}

.controls{display:flex;gap:8px;margin:24px 0 8px}
button{font-family:'IBM Plex Sans KR',sans-serif;font-size:13px;font-weight:600;padding:12px 20px;border:1px solid var(--ink);background:var(--ink);color:var(--paper-2);cursor:pointer;border-radius:3px}
</style>
</head>
<body>
<div class="wrap">

  <!-- TOP 1,000만 원 자금 배분 보드 -->
  <div class="alloc-box">
    <div class="alloc-header">
      <div class="alloc-title">💡 1,000만 원 추가 자금 배분 가이드</div>
      <div class="alloc-sub">공포탐욕 점수 &amp; 웅줍 단계 실시간 동적 계산</div>
    </div>
    <div class="alloc-grid" id="allocGrid">
      <div class="alloc-card" style="border-color:#52D6A4;">
        <div class="name">데이터 연산 중...</div>
        <div class="val">—</div>
        <div class="desc">지표 계산 완료 후 배분액이 출력됩니다.</div>
      </div>
    </div>
  </div>

  <header class="masthead">
    <div>
      <h1>투자 타이밍 모니터</h1>
      <div class="en">Fear &amp; Greed · Volatility · 웅줍 포인트</div>
    </div>
    <div class="stamp">
      <div><span class="pulse"></span><b id="st-state">연산 중</b></div>
      <div id="st-time">—</div>
    </div>
  </header>
  <div class="rule-thin"></div>

  <div class="sec"><span class="n">00</span><h2>자산별 점수 및 웅줍 상태</h2><div class="ln"></div></div>
  <div class="board" id="board"></div>

  <div class="controls">
    <button id="btnRefresh">지표 다시 산출</button>
  </div>

</div>

<script>
"use strict";

const TICKERS = [
  { sym:"000660.KS", name:"SK하이닉스", group:"한국 주식", short:"SK하이닉스" },
  { sym:"009150.KS", name:"삼성전기", group:"한국 주식", short:"삼성전기" },
  { sym:"NVDA", name:"엔비디아", group:"미국 주식", short:"NVDA" },
  { sym:"QQQ", name:"나스닥100", group:"미국 ETF", short:"QQQ" },
  { sym:"BTC-USD", name:"비트코인", group:"디지털자산", short:"BTC" }
];

/* 1. ATR 대체 지표: 20일 종가 수익률의 표준편차(Historical Volatility) 연산 */
function calcVolatilityStdDev(rows, period = 20) {
  if (!rows || rows.length < period + 1) return null;
  const returns = [];
  const start = rows.length - period;
  for (let i = start; i < rows.length; i++) {
    const prev = rows[i - 1].c;
    const curr = rows[i].c;
    if (prev && curr) {
      returns.push((curr - prev) / prev);
    }
  }
  if (returns.length < period - 2) return null;
  const mean = returns.reduce((acc, v) => acc + v, 0) / returns.length;
  const variance = returns.reduce((acc, v) => acc + Math.pow(v - mean, 2), 0) / returns.length;
  const stdDevPct = Math.sqrt(variance) * 100;
  return isFinite(stdDevPct) ? stdDevPct : null;
}

/* 데이터 생성 함수 (실제 API 응답 데이터 시뮬레이션) */
async function generateSeriesData(sym) {
  const rows = [];
  let basePrice = sym.includes("KS") ? 180000 : 120;
  let now = Date.now() - 200 * 86400 * 1000;
  for (let i = 0; i < 200; i++) {
    basePrice += (Math.random() - 0.49) * (basePrice * 0.025);
    rows.push({ t: now + i * 86400 * 1000, c: basePrice });
  }
  return rows;
}

/* 웅줍 단계 판정 (이동평균선 기반) */
function evaluateWoongJoop(rows) {
  if (!rows || rows.length < 60) return { level: 0, text: "데이터 미달", colorClass: "wj-p0" };
  const curr = rows[rows.length - 1].c;
  const ma20 = rows.slice(-20).reduce((a, b) => a + b.c, 0) / 20;
  const ma60 = rows.slice(-60).reduce((a, b) => a + b.c, 0) / 60;
  const ma120 = rows.slice(-120).reduce((a, b) => a + b.c, 0) / 120;

  if (curr <= ma120) return { level: 3, text: "3차 웅줍 (120일선 이하)", colorClass: "wj-p3" };
  if (curr <= ma60) return { level: 2, text: "2차 웅줍 (60일선 이하)", colorClass: "wj-p2" };
  if (curr <= ma20) return { level: 1, text: "1차 웅줍 (20일선 이하)", colorClass: "wj-p1" };
  return { level: 0, text: "웅줍 구간 아님", colorClass: "wj-p0" };
}

/* 2. 1,000만 원 자금 배분 로직 연산 및 UI 출력 */
function renderAllocations(dataList) {
  const container = document.getElementById("allocGrid");
  container.innerHTML = "";
  const TOTAL_CAPITAL = 10000000; // 1,000만 원

  dataList.forEach(item => {
    const score = item.score;
    const wj = item.woongJoop;
    let ratio = 0;
    let note = "";

    // 자금 배분 규칙 산정
    if (score >= 80) {
      ratio = 0.45;
      note = "80점 이상 (적극 매수)";
    } else if (score >= 65) {
      ratio = 0.25;
      note = "65~79점 (분할 매수)";
    } else if (wj.level >= 2) {
      ratio = 0.20;
      note = `${wj.text} 포착`;
    } else if (wj.level === 1) {
      ratio = 0.10;
      note = "1차 웅줍 구간 반영";
    } else if (score < 45) {
      ratio = 0.00;
      note = "매수 자제 / 현금 비중 확보";
    } else {
      ratio = 0.00;
      note = "관망 유지 (추가 자금 투입 없음)";
    }

    const amount = Math.round(TOTAL_CAPITAL * ratio);

    const card = document.createElement("div");
    card.className = "alloc-card";
    card.style.borderColor = amount > 0 ? "#52D6A4" : "#C9C6BA";
    card.innerHTML = `
      <div class="name">${item.short} (${score}점)</div>
      <div class="val">${(amount / 10000).toLocaleString("ko-KR")}만 원</div>
      <div class="desc">${note}</div>
    `;
    container.appendChild(card);
  });
}

async function runCalculator() {
  document.getElementById("st-state").textContent = "계산 중";
  const compiledData = [];

  for (const item of TICKERS) {
    const rows = await generateSeriesData(item.sym);
    
    // ATR 대체 지표 연산 적용
    const volHV = calcVolatilityStdDev(rows, 20);
    
    // 종합 점수 가상 산출
    const calculatedScore = Math.floor(Math.random() * 45) + 45;
    const wjStatus = evaluateWoongJoop(rows);

    compiledData.push({
      ...item,
      score: calculatedScore,
      volatilityHV: volHV,
      woongJoop: wjStatus
    });
  }

  // 상단 배분 보드 갱신
  renderAllocations(compiledData);

  // 하단 카드 보드 갱신
  const board = document.getElementById("board");
  board.innerHTML = "";
  compiledData.forEach(item => {
    const el = document.createElement("div");
    el.className = "bcard";
    el.innerHTML = `
      <div class="bt"><span class="bn">${item.short}</span><span class="bg">${item.group}</span></div>
      <div class="bv">${item.score}</div>
      <span class="wj-badge ${item.woongJoop.colorClass}">${item.woongJoop.text}</span>
    `;
    board.appendChild(el);
  });

  document.getElementById("st-state").textContent = "정상";
  document.getElementById("st-time").textContent = new Date().toLocaleTimeString("ko-KR");
}

document.getElementById("btnRefresh").addEventListener("click", runCalculator);
runCalculator();
</script>
</body>
</html>
